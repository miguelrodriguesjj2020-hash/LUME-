name: LUME Android Emulator Smoke v2

on:
  workflow_run:
    workflows: ["LUME Android Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  emulator-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download exact APK artifact from successful build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lume-qa-release-apk
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded artifact integrity
        run: |
          set -euo pipefail
          APK="$(find artifact -type f -name app-release.apk -print -quit)"
          HASH_FILE="$(find artifact -type f -name app-release.apk.sha256 -print -quit)"
          test -n "$APK" && test -f "$APK"
          test -n "$HASH_FILE" && test -f "$HASH_FILE"
          EXPECTED="$(awk '{print $1}' "$HASH_FILE")"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          printf 'APK=%s\nSHA256=%s\n' "$APK" "$ACTUAL" | tee artifact/emulator-input.txt

      - name: Enable KVM acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Android 15 install, launch and relaunch smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072
          force-avd-creation: true
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash tool/android_emulator_smoke.sh

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lume-android15-emulator-smoke-v2
          path: artifact/emulator-qa/*
          if-no-files-found: warn
          retention-days: 14
