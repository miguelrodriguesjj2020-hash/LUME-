name: LUME Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Reconstruct and verify exact Flutter source
        run: python tool/reconstruct_flutter_bundle.py

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Flutter environment
        working-directory: flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android scaffold
        working-directory: flutter
        run: flutter create --platforms=android --project-name=lume .

      - name: Harden generated Android scaffold
        run: python tool/harden_android_scaffold.py

      - name: Apply audited build fixes
        run: |
          set -euo pipefail
          git apply --check tool/flutter_build_fixes.patch
          git apply tool/flutter_build_fixes.patch
          if [ -f flutter/test/widget_test.dart ]; then
            grep -q 'MyApp' flutter/test/widget_test.dart
            rm flutter/test/widget_test.dart
          fi
          if [ -f flutter/analysis_options.yaml ]; then
            grep -q 'package:flutter_lints/flutter.yaml' flutter/analysis_options.yaml
            rm flutter/analysis_options.yaml
          fi
          grep -q '^version: 0.35.3+38$' flutter/pubspec.yaml
          command -v zip >/dev/null
          cp tool/build_tests/*.dart flutter/test/

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: |
          set -o pipefail
          mkdir -p build/qa
          flutter analyze --fatal-infos | tee build/qa/flutter-analyze.log

      - name: Flutter tests
        working-directory: flutter
        run: |
          set -o pipefail
          flutter test | tee build/qa/flutter-test.log

      - name: Build QA release APK
        working-directory: flutter
        env:
          LUME_API_BASE: ${{ secrets.LUME_API_BASE }}
        run: |
          set -euo pipefail
          if [ -n "$LUME_API_BASE" ]; then
            flutter build apk --release --dart-define=LUME_API_BASE="$LUME_API_BASE"
            echo 'API_BASE_STATUS=configured' > build/qa/api-base-status.txt
          else
            flutter build apk --release
            echo 'API_BASE_STATUS=placeholder-lume.invalid' > build/qa/api-base-status.txt
          fi
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Audit Android APK metadata and signature
        working-directory: flutter
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          QA=build/qa
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee "$QA/aapt-badging.txt"
          "$AAPT" dump permissions "$APK" | tee "$QA/aapt-permissions.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$QA/apksigner.txt"
          grep -q "package: name='br.com.lume.bibliotecaestudantil'" "$QA/aapt-badging.txt"
          grep -q "application-label:'LUME'" "$QA/aapt-badging.txt"
          grep -q "uses-permission: name='android.permission.INTERNET'" "$QA/aapt-permissions.txt"
          unzip -t "$APK" > "$QA/apk-zip-integrity.txt"
          unzip -p "$APK" lib/arm64-v8a/libapp.so > "$QA/libapp-arm64.so"
          if strings "$QA/libapp-arm64.so" | grep -q 'https://lume.invalid'; then
            echo 'EMBEDDED_API_STATUS=placeholder-lume.invalid' | tee "$QA/embedded-api-status.txt"
          else
            echo 'EMBEDDED_API_STATUS=non-placeholder' | tee "$QA/embedded-api-status.txt"
          fi
          rm "$QA/libapp-arm64.so"
          if grep -q 'CN=Android Debug' "$QA/apksigner.txt"; then
            echo 'SIGNING_STATUS=qa-debug-certificate' | tee "$QA/signing-status.txt"
          else
            echo 'SIGNING_STATUS=non-debug-certificate' | tee "$QA/signing-status.txt"
          fi

      - name: Upload QA APK and audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lume-qa-release-apk
          path: |
            flutter/build/app/outputs/flutter-apk/app-release.apk
            flutter/build/app/outputs/flutter-apk/app-release.apk.sha256
            flutter/build/qa/*
          if-no-files-found: error
          retention-days: 14
