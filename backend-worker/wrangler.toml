name = "lume-api"
main = "src/worker.mjs"
compatibility_date = "2026-09-12"

[vars]
LUME_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "lume"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60
